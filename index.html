<style>

.scroll{overflow-y:auto;padding:12px 14px 24px;touch-action:pan-y}

#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#hint{margin-bottom:6px;color:#a8d8ff;font:14px system-ui,sans-serif;text-align:center}

.pack{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s}

.crk{position:absolute;inset:0;background:var(--crk);background-size:100% 100%;mix-blend-mode:overlay;opacity:.95}

.crimp.t{top:0}.crimp.b{bottom:0;transform:scaleY(-1)}
.logo{position:absolute;top:46px;left:50%;width:100px;height:100px;margin-left:-50px;filter:drop-shadow(0 3px 3px #000a) drop-shadow(0 -1px 1px #fff6)}
.ttl{position:absolute;top:154px;left:0;right:0;text-align:center;font:900 31px Impact,'Arial Black',sans-serif;letter-spacing:.1em;background:linear-gradient(180deg,#fff,#d4dae4 44%,#6c7686 54%,#eef2f8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 1px #000b) drop-shadow(0 0 8px var(--a))}
.band{position:absolute;top:202px;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:center;font:800 11px system-ui,sans-serif;letter-spacing:.18em;color:#1c1c24;background:linear-gradient(180deg,#fafafe,#9a9aa4 50%,#d8d8de);box-shadow:0 2px 6px #0007,inset 0 1px #fff}

#deck{position:relative;width:250px;height:360px;display:none;touch-action:none}

/* ===== cartes ===== */
.card{position:absolute;inset:0;transition:transform .4s cubic-bezier(.2,.8,.3,1),opacity .35s;perspective:900px}
.card.drag{transition:none}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s}

.card.flipped .inner{transform:rotateY(180deg)}
.nt .inner{transition:none}
.face,.back{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:radial-gradient(circle at 50% 45%,#2a4a8a,#14214a 55%,#070b1c);border:5px solid #dcdce4;box-shadow:0 12px 30px #000,inset 0 0 0 3px #0008;display:flex;align-items:center;justify-content:center}
.back::before{content:"";position:absolute;inset:10px;border:2px solid #fff5;border-radius:10px;background:repeating-linear-gradient(45deg,#0000 0 9px,#ffffff10 9px 10px)}
.back::after,.face::before,.pn::before{content:"";position:absolute;inset:0;background:var(--tex);mix-blend-mode:overlay;opacity:.55;pointer-events:none}
.back svg{width:110px;height:110px;position:relative;z-index:1;filter:drop-shadow(0 3px 6px #000)}
.face{transform:rotateY(180deg);padding:8px;background:var(--f);box-shadow:inset 0 0 0 1px #fff7,inset 0 2px 3px #fffa,inset 0 -3px 6px #0009,0 0 30px var(--g),0 14px 28px #000;overflow:hidden}
.face::before{z-index:7;opacity:.6;border-radius:18px}
.face::after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;border-radius:18px;background:linear-gradient(115deg,#fff0 30%,#ffffff38 44%,#fff0 58%);background-size:300% 100%;background-position:var(--px,50%) 0}
.mythique.face,.t-mythique{padding:15px}
.pn{position:relative;height:100%;border-radius:11px;background:var(--p);padding:8px;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1.5px #000b,inset 0 0 14px #000a,0 0 0 1px #fff4;overflow:hidden}
.pn>*{position:relative}
.hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 7px;border-radius:7px;background:linear-gradient(180deg,#ffffff30,#0000 55%,#0005);box-shadow:inset 0 0 0 1px #fff3,inset 0 -1px 2px #000}
.hd h2{margin:0;font-size:15px;text-shadow:0 2px 3px #000;line-height:1.1}
.t-mythique .hd h2{text-shadow:-1px 0 #f0f,1px 0 #0ff,0 0 8px #fff8}
.no{min-width:34px;text-align:right;font:800 9px system-ui,sans-serif;letter-spacing:.06em;opacity:.8}
.art{margin:7px 0;border-radius:8px;padding:3px;background:var(--f);box-shadow:0 2px 4px #000a,inset 0 1px #fff9;flex:1;min-height:0}
.ph{position:relative;height:100%;border-radius:5px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#3a4a5a,#10161e);box-shadow:inset 0 0 14px #000}
.ph img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;transform:translate(calc(var(--tx,0)*-7px),calc(var(--ty,0)*-5px));transition:transform .15s;filter:contrast(1.06) saturate(1.12)}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#0000 55%,#0009),linear-gradient(160deg,#fff3,#fff0 35%);pointer-events:none;box-shadow:inset 0 0 0 1px #0008}
.rib{text-align:center;font:800 9px system-ui,sans-serif;letter-spacing:.26em;color:#1a1208;padding:3px 0;background:var(--f);border-radius:3px;box-shadow:inset 0 1px #fff8,0 1px 2px #000}
.desc{font-style:italic;font-size:10.5px;text-align:center;margin:5px 4px 3px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:3px}
.inf div{background:#0007;border-radius:5px;padding:3px 2px;text-align:center;font:700 8.5px system-ui,sans-serif;line-height:1.25;box-shadow:inset 0 0 0 1px #fff2}
.inf i{display:block;font-style:normal;font-weight:600;font-size:7px;letter-spacing:.12em;color:#9ab;margin-bottom:1px}
.rb,.pr,.sp,.shn{position:absolute;inset:0;pointer-events:none;z-index:3}
.rb{background:linear-gradient(115deg,#f55,#fd5,#5f8,#5df,#85f,#f5c,#f55);background-size:260% 260%;background-position:var(--px,50%) var(--py,50%);mix-blend-mode:color-dodge;opacity:var(--rbo,0)}
.pr{background:repeating-linear-gradient(62deg,#f00 0,#ff0 8%,#0f0 16%,#0ff 24%,#00f 32%,#f0f 40%,#f00 48%);background-size:300% 300%;background-position:var(--px,50%) var(--py,50%);mix-blend-mode:overlay;opacity:var(--pro,0)}
.sp{background:radial-gradient(circle at 18% 22%,#fff 0 1.2px,#0000 2.4px),radial-gradient(circle at 72% 30%,#fff 0 1.2px,#0000 2.4px),radial-gradient(circle at 40% 64%,#fff 0 1.2px,#0000 2.4px),radial-gradient(circle at 84% 78%,#fff 0 1.2px,#0000 2.4px),radial-gradient(circle at 26% 86%,#fff 0 1.2px,#0000 2.4px);animation:tw 1.6s infinite alternate;opacity:var(--spo,0)}
@keyframes tw{from{opacity:.1}to{opacity:var(--spo,0)}}
.shn{background:linear-gradient(115deg,transparent 38%,#fff6 50%,transparent 62%);background-size:300% 100%;animation:sw 3s infinite;mix-blend-mode:overlay;display:var(--s,none)}
.t-commune{--f:linear-gradient(145deg,#d6d6de,#8a8a94 50%,#c4c4cc);--p:linear-gradient(180deg,#34343a,#1a1a1e);--b:#aaa;--g:#0000}
.t-rare{--f:linear-gradient(145deg,#bfe4ff,#3a86d8 50%,#8fd0ff);--p:linear-gradient(180deg,#143a6a,#08152c);--b:#6cb8ff;--g:#4aa8ff88;--rbo:.28}
.t-legendaire.s-gld{--f:linear-gradient(145deg,#fff4b0,#e0a800 40%,#8a5f00 62%,#ffe27a);--p:linear-gradient(180deg,#4a3300,#1a1000);--b:#ffd34d;--g:#ffd34dbb}
.t-legendaire.s-plt{--f:linear-gradient(145deg,#fff,#aeb8c8 40%,#6a7488 62%,#f0f4fa);--p:linear-gradient(180deg,#232a38,#0a0d14);--b:#dfe8f8;--g:#bcd0ffaa}
.t-legendaire{--s:block;--rbo:.4;--spo:.9;--pro:.16}
.t-mythique{--s:block;--rbo:.55;--spo:1;--pro:.34}
.t-mythique.s-obs{--f:linear-gradient(145deg,#8a8a96,#0c0c10 30%,#2a2a34 52%,#b4b4c2 68%,#08080a);--p:linear-gradient(180deg,#16161c,#040406);--b:#d0d0de;--g:#9a8aff99}
.t-mythique.s-pri{--f:conic-gradient(from 210deg,#f0f,#0ff,#3f9,#ff0,#f80,#f0f);--p:linear-gradient(180deg,#2c0a5a,#0c0226);--b:#e6a8ff;--g:#c04dffdd}
.t-mythique.s-imp{--f:linear-gradient(145deg,#fff1a0,#d49a00 38%,#6a4600 60%,#ffd860);--p:linear-gradient(180deg,#4a0814,#16020a);--b:#ffd34d;--g:#ff3b5ccc}
.gem{position:absolute;width:12px;height:12px;z-index:9;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 11%,#fff0 30%),conic-gradient(from 30deg,var(--c1),var(--c2),var(--c1),var(--c2),var(--c1));box-shadow:0 0 0 1.5px #20180a,0 0 0 2.6px #e8c85a,inset 0 0 3px #000a,0 0 7px var(--c1);animation:gs 2.4s infinite}
.gem.q{border-radius:3px}.gem.d{border-radius:2px;transform:rotate(45deg) scale(.82)}
@keyframes gs{50%{filter:brightness(1.7) saturate(1.3)}}
.g-r{--c1:#ff3b5c;--c2:#6a0014}.g-b{--c1:#4a8cff;--c2:#08186a}.g-e{--c1:#33e08a;--c2:#04502a}.g-a{--c1:#c070ff;--c2:#34086a}.g-t{--c1:#ffc83a;--c2:#7a4400}.g-d{--c1:#effffe;--c2:#5a8ca6}
.rv{position:absolute;width:8px;height:8px;border-radius:50%;z-index:9;background:radial-gradient(circle at 35% 30%,#fff,#d4a000 55%,#5a3a00);box-shadow:0 1px 2px #000}
.mini{position:relative;flex:none}
.mini .card{width:250px;height:360px;right:auto;bottom:auto;transform:scale(var(--k));transform-origin:0 0;transition:none}
.btn{padding:12px 24px;border-radius:30px;border:0;background:linear-gradient(#5ab8ff,#1a5ac8);color:#fff;font-size:15px;font-weight:700;box-shadow:0 0 18px #4af4;margin:6px}
.btn.g{background:#ffffff18;box-shadow:none}.btn:disabled{opacity:.35}
h1{font-size:18px;margin:0 0 4px;letter-spacing:.06em}
.sub{font:12px system-ui,sans-serif;color:#8a8aa0;margin-bottom:12px}
.sec{font:700 11px system-ui,sans-serif;letter-spacing:.2em;color:#a8d8ff;margin:16px 0 8px}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.slot{position:relative;border-radius:10px;cursor:pointer}
.slot.no{border:2px dashed #ffffff30;display:flex;align-items:center;justify-content:center;font:900 22px Impact,sans-serif;color:#ffffff30}
.slot .bd{position:absolute;right:-4px;top:-6px;background:#5ab8ff;color:#000;font:800 11px system-ui,sans-serif;border-radius:10px;padding:2px 6px;z-index:9}
.slot.on{outline:3px solid #5ab8ff;outline-offset:2px;border-radius:12px}
.qh{font:700 11px system-ui,sans-serif;letter-spacing:.2em;color:#a8d8ff;text-align:center;margin:8px 0}
.qp{width:230px;height:150px;margin:6px auto;border-radius:12px;overflow:hidden;background:#10161e center/cover;box-shadow:0 0 0 2px #ffffff30,0 10px 24px #000}
.qp img{width:100%;height:100%;object-fit:cover}
.qq{font-size:17px;text-align:center;margin:14px 6px;line-height:1.35}
.qa{display:block;width:100%;max-width:400px;margin:8px auto;padding:13px;border-radius:12px;border:1px solid #ffffff30;background:#ffffff10;color:#fff;font:600 14px system-ui,sans-serif}
.qa.ok{background:#1f9a4e;border-color:#6f8}.qa.ko{background:#a02a2a;border-color:#f66}
.res{font:900 34px Impact,sans-serif;letter-spacing:.12em;text-align:center;margin:10px 0;text-shadow:0 0 20px currentColor}
#viewer{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none;perspective:1000px}
#viewer.on{display:flex}
#vcard{position:relative;width:250px;height:360px;transform:scale(1.04);margin-bottom:30px;perspective:900px}
#vcard .card{transition:none}
#sheet{width:calc(100% - 28px);max-width:400px;padding:14px 18px;border-radius:18px;background:rgba(14,12,26,.93);border:1px solid #ffffff30;max-height:34vh;overflow:hidden}
#sheet h3{margin:0;font-size:19px}
#sheet em{display:block;color:#9ab;font-size:12px;margin:2px 0 8px}
#sheet p{margin:0 0 8px;font-size:13px;line-height:1.45;color:#e8e8f0}
#sheet small{display:block;font:11px system-ui,sans-serif;color:#889;line-height:1.5}
#sheet a{color:#8cf}
#gemfx{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#000a,#000);--fx:#ffc83a}
#gemfx.on{display:flex;animation:fin .3s}
@keyframes fin{from{opacity:0}}
.rays2{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(var(--fx) 0 4deg,#0000 4deg 16deg);opacity:.28;animation:rot 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 5%,transparent 45%);mask:radial-gradient(circle,#000 5%,transparent 45%)}
@keyframes rot{to{transform:rotate(360deg)}}
.dia{position:relative;width:150px;height:150px;animation:dspin 1.5s ease-in forwards;filter:drop-shadow(0 0 24px var(--fx)) drop-shadow(0 0 60px var(--fx))}
@keyframes dspin{from{transform:rotateY(0) scale(.3)}to{transform:rotateY(1080deg) scale(1.5)}}
.dia polygon{fill:var(--fx);stroke:#fff;stroke-width:1.2;stroke-linejoin:round}
#fxt{position:absolute;bottom:22%;font:900 22px Impact,sans-serif;letter-spacing:.35em;color:#fff;text-shadow:0 0 14px var(--fx);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.5}}

/* ===== JUICE ===== */
.pk .fl{animation:float 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-6px) rotate(.5deg)}}
.pk::after{animation:shd 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes shd{50%{transform:scale(.7);opacity:.45}}
.sk{position:absolute;bottom:14%;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px var(--a);opacity:0;pointer-events:none;z-index:3;animation:rise 3.6s ease-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translateY(-190px) scale(1.1)}}
.pk.sel .sk{display:none}
.card.top[data-t=r]:not(.flipped) .back,.card.top[data-t=l]:not(.flipped) .back,.card.top[data-t=m]:not(.flipped) .back{animation:aura .8s ease-in-out infinite alternate;border-color:var(--au)}
.card.top[data-t=r]{--au:#4aa8ff;--aw:14px}.card.top[data-t=l]{--au:#ffc83a;--aw:30px}.card.top[data-t=m]{--au:#c04dff;--aw:46px}
@keyframes aura{from{box-shadow:0 12px 30px #000,0 0 6px 0 var(--au),inset 0 0 0 3px #0008}to{box-shadow:0 12px 30px #000,0 0 var(--aw) calc(var(--aw)*.4) var(--au),inset 0 0 0 3px #0008}}
#stage.shk,#gemfx.shk{animation:shk .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{10%,90%{transform:translate(calc(var(--k)*-.3),0)}20%,80%{transform:translate(calc(var(--k)*.6),calc(var(--k)*.3))}30%,50%,70%{transform:translate(calc(var(--k)*-1),calc(var(--k)*-.4))}40%,60%{transform:translate(var(--k),calc(var(--k)*.4))}}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:130}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 1px);right:4px;z-index:6;background:none;border:0;color:#aab;font-size:16px;padding:4px 8px}
.mini.pop{animation:popin .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes popin{from{transform:scale(.2) rotate(-14deg);opacity:0}}
.best{font:900 15px Impact,sans-serif;letter-spacing:.2em;margin:2px 0 8px;text-shadow:0 0 14px currentColor;animation:pul 1.2s infinite}
#rn{animation:pul 1.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.07);box-shadow:0 0 28px #4af8}}
/* fix : le logo du dos ne doit jamais traverser vers l'avant */
.back,.back *{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transition:visibility 0s .14s}
.face{visibility:hidden;transition:visibility 0s .14s}
.card.flipped .back{visibility:hidden}
.card.flipped .face{visibility:visible}

 if(v==="vInv")renderInv();if(v==="vQz")renderQz();if(v==="vOpen"&&!busy)buildPacks();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.v));
const cardOf=i=>({s:B[i]});
/* ---------- album ---------- */
function renderInv(){
 const v=$("vInv");v.innerHTML=`<h1>ALBUM</h1><div class="sub">${Object.keys(inv).length} / ${B.length} espèces · aucun doublon possible</div>`;
 BOOST.forEach((b,bi)=>{
  const mine=B.filter(s=>s.bi===bi);v.insertAdjacentHTML("beforeend",`<div class="sec">${b.n} · ${mine.filter(s=>inv[s.i]).length}/${mine.length}</div>`);
  const g=document.createElement("div");g.className="grid";
  mine.forEach(s=>{
   if(inv[s.i]){const m=mini(cardOf(s.i),.42);m.classList.add("slot");m.onclick=()=>openViewer(cardOf(s.i));g.appendChild(m)}
   else{const sl=document.createElement("div");sl.className="slot no";sl.style.cssText=`width:105px;height:151px`;sl.textContent="?";g.appendChild(sl)}
  });v.appendChild(g);
 });
}
/* ---------- quiz ---------- */
let sel=[];
function renderQz(){
 const v=$("vQz"),have=Object.keys(inv).map(Number);sel=sel.filter(i=>inv[i]);
 v.innerHTML=`<h1>QUIZ · BÊTA</h1><div class="sub">Choisis 3 cartes : 2 questions par carte. Chaque bonne réponse = +1 point de puissance (meilleures raretés). Total : ${QP} pts</div>`;
 if(have.length<3){v.insertAdjacentHTML("beforeend",'<div class="sub" style="text-align:center;margin-top:40px">Il te faut au moins 3 cartes.<br>Ouvre un booster pour commencer !</div>');return}
 const g=document.createElement("div");g.className="grid";
 have.sort((a,b)=>a-b).forEach(i=>{const m=mini(cardOf(i),.42);m.classList.add("slot");if(sel.includes(i)){m.classList.add("on");m.insertAdjacentHTML("beforeend",`<span class="bd">${sel.indexOf(i)+1}</span>`)}
  m.onclick=()=>{const k=sel.indexOf(i);if(k>=0)sel.splice(k,1);else if(sel.length<3)sel.push(i);const y=v.scrollTop;renderQz();v.scrollTop=y};g.appendChild(m)});
 v.appendChild(g);
 v.insertAdjacentHTML("beforeend",`<div style="text-align:center;margin-top:18px"><button class="btn" id="go" ${sel.length<3?"disabled":""}>Lancer le quiz</button></div>`);
 $("go").onclick=()=>quiz(sel.slice());
}
const opts=(c,pool)=>shuf([c,...shuf([...new Set(pool)].filter(x=>x!==c)).slice(0,3)]);
async function mkQ(s){
 const f=await info(s).catch(()=>({})),n=dn(s),same=B.filter(x=>x.bi===s.bi&&x!==s);
 const v=stats(s),j=R(0,3),T={
  reg:()=>({q:`Dans quelle famille classe-t-on ${n} ?`,a:REG[s.bi],o:opts(REG[s.bi],REG)}),
  sta:()=>({q:`Combien de points de ${STN[j]} a ${n} sur sa carte ?`,a:String(v[j]),o:opts(String(v[j]),["3","4","5","6","7","8","9","10"])}),
  pic:()=>({q:"Quelle est cette race ?",a:n,o:opts(n,same.map(dn))})
 };
 const types=shuf(["reg","sta",...(f.img?["pic"]:[])]).slice(0,2);
 return types.map(t=>({...T[t](),img:f.img,th:f.th}));
}
async function quiz(team){
 const v=$("vQz");v.innerHTML='<div class="sub" style="text-align:center;margin-top:60px">Préparation du quiz…</div>';
 const Q=(await Promise.all(team.map(i=>mkQ(B[i])))).flat();let sc=0;
 for(let k=0;k<Q.length;k++){
  const x=Q[k];
  await new Promise(done=>{
   v.innerHTML=`<div class="qh">QUESTION ${k+1} / ${Q.length}</div><div class="qp">${x.img?`<img src="${x.img}" data-f="${x.th}" onerror="this.onerror=null;this.src=this.dataset.f" alt="">`:""}</div><div class="qq">${x.q}</div>`;
   x.o.forEach(o=>{const b=document.createElement("button");b.className="qa";b.textContent=o;b.onclick=async()=>{
    v.querySelectorAll(".qa").forEach(y=>{y.disabled=true;if(y.textContent===x.a)y.classList.add("ok")});
    if(o===x.a){sc++;AU.play("ok");vib(20)}else{b.classList.add("ko");AU.play("ko");vib([50,40,50])}await sleep(1300);done()};v.appendChild(b)});
  });
 }
 QP+=sc;save();updHud();
 v.innerHTML=`<div class="res" style="color:${sc>=4?"#6f8":sc>=2?"#fd5":"#f66"}">${sc} / ${Q.length}</div><div class="sub" style="text-align:center">${sc>=Q.length?"Parfait !":sc>=4?"Très bien joué !":"Continue, tu progresses !"} +${sc} pt(s) de puissance</div><div style="text-align:center"><button class="btn" id="rp">Rejouer</button><button class="btn g" id="rb2">Retour</button></div>`;
 $("rp").onclick=()=>quiz(team);$("rb2").onclick=renderQz;
}
buildPacks();
</script></body></html>
